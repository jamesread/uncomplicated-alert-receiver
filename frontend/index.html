<!DOCTYPE html>

<head>
	<title>Uncomplicated Alert Receiver</title>

	<link rel="stylesheet" type="text/css" href="css/style.css">
	<link rel="shortcut icon" href="images/icons/logo.png">

	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#444">
	<link rel="apple-touch-icon" href="images/icons/logo.png">
</head>

<body>
	<header>
		<div class = "logo-and-title fg1">
			<div class="logo-container">
				<div class="dropdown">
					<button class="dropdown-toggle" aria-label="Menu">
						<img src = "images/icons/logo.png" alt = "Uncomplicated Alert Receiver Logo" class = "logo">
					</button>
					<div class="dropdown-menu">
						<a href="https://github.com/jamesread/uncomplicated-alert-receiver" target="_blank" class="dropdown-item">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
								<path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
							</svg>
							GitHub
						</a>
						<a class="dropdown-item" href = "#" id="fullscreen-btn">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
								<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
							</svg>
							Fullscreen
						</a>
						<button type="button" class="dropdown-item" id="toggle-labels-btn" aria-pressed="false">
							<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
								<path d="M17.63 5.84C17.27 5.33 16.67 5 16 5L5 5.01C3.9 5.01 3 5.9 3 7v10c0 1.1.9 1.99 2 1.99L16 19c.67 0 1.27-.33 1.63-.84L22 12l-4.37-6.16z"/>
							</svg>
							<span id="toggle-labels-text">Show labels</span>
						</button>
					</div>
				</div>
			</div>
			<h1>Uncomplicated Alert Receiver</h1>
		</div>
		<div>
			<p class = "subtle">Next page refresh:</p>
			<p><progress id = "next-update" value = "0" max = "30" title = "Time until next update"></progress></p>
		</div>
		<div id = "last-updated-container">
				<p class = "subtle">Last result:</p>
			<p id = "last-updated">
				Never updated
			</p>
		</div>
	</header>

	<div id="filter-bar" class="filter-bar" hidden>
		<span class="filter-bar__label">Filters:</span>
		<div id="active-filters" class="filter-bar__chips" aria-live="polite"></div>
		<button type="button" id="edit-filters-btn" class="filter-bar__btn">Edit</button>
		<button type="button" id="clear-filters-btn" class="filter-bar__btn">Clear</button>
		<form id="filter-edit-form" class="filter-bar__edit-form" hidden>
			<input type="text" id="filter-edit-input" class="filter-bar__input" placeholder="key=value key2=value2" aria-label="Edit filters" autocomplete="off" spellcheck="false">
		</form>
	</div>

	<main>
		<div id = "alert-container">
			<div id = "offline-message" class="offline-message" aria-live="polite" hidden>
				<p class="offline-message__title">Cannot connect to the server</p>
				<p class="offline-message__body">You appear to be offline or the alert receiver is unreachable. Alerts will appear here once the connection is restored.</p>
			</div>
			<div id = "alert-list">
				<!-- Alerts will be added here -->
			</div>
		</div>

		<script type = "module">
			import main from "./js/main.js";
			main();
		</script>
	</main>

	<footer>
		<span><a href = "https://github.com/jamesread/uncomplicated-alert-receiver">UAR on GitHub</a></span>
		<span><a href = "https://jamesread.github.io/uncomplicated-alert-receiver/">Docs</a></span>
		<span id = "current-version"></span>
	</footer>
</body>
