# Marketing screenshots, captured by `make` in this directory against the
# throwaway receiver it starts (see Makefile / seed/).
#
# title/description/theme are not used by repo-helper; `make manifest` turns
# them into screenshot-manifest.yaml for indexers. Every section needs them.

[DEFAULT]
base_url = http://127.0.0.1:18400/
dir = .
width = 1280
height = 800
script = scripts/light.py, scripts/prepare.py
post_script_sleep = 1.5
theme = light
manifest_project = Uncomplicated Alert Receiver
manifest_base_url = https://raw.githubusercontent.com/jamesread/uncomplicated-alert-receiver/main/var/marketing/screenshots/

[board]
url = .
title = Alert board
description = Every firing Alertmanager alert on one simple board, colour-coded by severity with how long it has been firing, so a heads up display shows at a glance what is wrong right now.

[filtered]
url = .
script = scripts/light.py, scripts/prepare.py, scripts/filter.py
title = Filter by label
description = Click any label on an alert to narrow the board to matching alerts, so a team can focus on just the problems they own.

[preferences]
url = .
script = scripts/light.py, scripts/prepare.py, scripts/preferences.py
title = Preferences
description = Choose light or dark mode, a colour theme and whether labels are shown; preferences are saved in the browser, with no accounts or configuration files.

[phone]
url = .
width = 430
height = 932
title = Mobile view
description = The same board adapts to a phone screen, so alerts can be checked away from the wall display.

# Dark variants last; the browser session (and localStorage) is shared.
[board-dark]
url = .
script = scripts/dark.py, scripts/prepare.py
theme = dark
title = Dark mode
description = A dark colour scheme that is easy on the eyes for wall-mounted displays and operations rooms.
